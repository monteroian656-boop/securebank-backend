name: CI - SecureBank Solutions

# Corre en cada push y pull request hacia main/develop, para verificar
# que el código construye, pasa análisis estático y las pruebas
# (unitarias e integración) antes de fusionar cambios.
on:
  push:
    branches: [main, develop, final, 'full-project*']
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend - Lint, Build & Tests
    runs-on: ubuntu-latest

    # BD real de Postgres para las pruebas de integración.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: securebank_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/securebank_test
      JWT_SECRET: ci-test-secret
      NODE_ENV: test

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Análisis estático (ESLint)
        run: npm run lint

      - name: Verificación de tipos y build (tsc)
        run: npm run build

      - name: Pruebas unitarias (con mocks)
        run: npm run test:coverage

      - name: Migrar base de datos de prueba
        run: npm run migrate

      - name: Pruebas de integración (app real + Postgres real)
        run: npm run test:integration

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage

  frontend:
    name: Frontend - Lint & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Análisis estático (ESLint)
        run: npm run lint

      - name: Build de producción (tsc + vite)
        run: npm run build
